<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive 3D view of the WAVES robotic workcell."><title>WAVES</title><link rel="stylesheet" href="style.css"></head><body>
<main>
<section class="viewer" aria-label="Interactive 3D workcell"><div id="view"><p id="loading" role="status">Loading…</p></div><div id="inset" aria-hidden="true"></div><div id="fade" aria-hidden="true"></div><div class="view-buttons"><button id="wide" class="selected">Lab</button><button id="robot">Robot</button><button id="close">Detail</button><button id="top">Top</button><button id="inset-toggle" aria-label="Toggle close-up inset" title="Close-up" aria-pressed="true">◱</button></div></section>
<section class="controls" aria-label="Playback controls"><button id="play" class="primary" aria-label="Pause animation">Ⅱ</button><button id="restart" aria-label="Restart animation" title="Restart">↺</button><label class="timeline"><input id="scrub" aria-label="Animation position" type="range" min="0" max="45.62" step="0.01" value="0"></label><span id="time">0:00</span><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></section>
</main><script type="module" src="app.js"></script></body></html>
